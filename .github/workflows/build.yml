name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Armar la estructura del proyecto
        run: |
          mkdir -p app/src/main/java/com/samuel/pantallalimpia
          mv app.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.java OverlayService.java app/src/main/java/com/samuel/pantallalimpia/

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pantalla-limpia-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pantalla limpia ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
